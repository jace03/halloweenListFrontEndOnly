schema: spec-driven

context: |
  Project: "Halloween Watchlist", a CoastNCode project.
  Currently frontend-only: TypeScript + React (Vite), CRUD over a hardcoded
  seed list, persisted to browser localStorage.
  Concept: Jace and his wife track the Halloween movies they want to watch
  (or have watched) together — title, year, who picked it, a 1-5 rating,
  watched status, and notes.
  This is a for-fun project that may grow into something more real later.

